[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openstack-performance-test-suite"
version = "0.1.0"
description = "A Python performance and load testing suite for OpenStack services."
requires-python = ">=3.11"
dependencies = [
    "openstacksdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
