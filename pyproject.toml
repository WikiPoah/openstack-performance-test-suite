[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openstack-performance-test-suite"
version = "0.4.1"
description = "OpenStack performance and release-regression test suite"
requires-python = ">=3.11"
dependencies = [
    "openstacksdk",
]

[project.scripts]
openstack-perf = "openstack_perf.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-bdd",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require an explicitly enabled live OpenStack environment",
]
