[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openstack-performance-test-suite"
version = "0.2.0"
description = "A Python performance and load testing suite for OpenStack services."
requires-python = ">=3.11"
dependencies = [
    "openstacksdk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-bdd",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require an explicitly enabled live OpenStack environment",
]
